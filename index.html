<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIYABONGA UNLIMITED V3 - REAL HITS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:white;font-family:'Segoe UI',sans-serif;padding-bottom:95px}
.header{padding:18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;font-weight:900;line-height:0.9}.logo span{color:#FFD700}
.profile{width:42px;height:42px;background:#FFD700;border-radius:50%;display:flex;align-items:center;justify-content:center;color:black;font-weight:900}
.now-playing{background:linear-gradient(135deg,#FFD700,#FF6A00);border-radius:26px;margin:10px 14px;padding:18px;color:black}
.now-top{display:flex;justify-content:space-between}
.now-label{font-size:11px;letter-spacing:2px;font-weight:800;opacity:0.7}
.song-title{font-size:28px;font-weight:900;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.artist{font-size:14px;font-weight:600;opacity:0.9}
#playerWrap{width:100%;height:0;overflow:hidden;transition:0.3s;border-radius:14px;margin-top:12px}
#playerWrap.show{height:220px}
iframe{width:100%;height:220px;border:none;border-radius:14px}
.controls{display:flex;justify-content:center;align-items:center;gap:28px;margin-top:14px}
.c-btn{width:50px;height:50px;background:rgba(0,0,0,0.18);border:none;border-radius:50%;font-size:18px}
.play-btn{width:74px;height:74px;background:black;color:#FFD700;border:none;border-radius:50%;font-size:28px;display:flex;align-items:center;justify-content:center}
.section{padding:14px}
.section-title{font-size:19px;font-weight:900;margin-bottom:10px}
.track{background:#1a1a1a;border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;border:1px solid #222;cursor:pointer}
.track.active{background:#2a2a2a;border-color:#FFD700}
.track-num{width:34px;height:34px;background:#2a2a2a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.track.active .track-num{background:#FFD700;color:black}
.track-info{flex:1;overflow:hidden}
.track-name{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-artist{font-size:11px;opacity:0.6}
.badge{font-size:9px;background:#FFD700;color:black;padding:2px 6px;border-radius:10px;font-weight:900}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#121212;border-top:1px solid #2a2a2a;display:flex;justify-content:space-around;padding:10px 0;z-index:99}
.nav-item{color:#666;text-align:center;font-size:12px;font-weight:700}
.nav-item.active{color:#FFD700}
</style>
</head>
<body>
<div class="header">
<div class="logo">SIYABONGA<br><span>UNLIMITED</span></div>
<div class="profile">S</div>
</div>
<div class="now-playing">
<div class="now-top">
<div>
<div class="now-label">🔴 NOW PLAYING REAL HIT</div>
<div class="song-title" id="curTitle">Mnike</div>
<div class="artist" id="curArtist">Tyler ICU ft Maphorisa</div>
</div>
<div style="font-size:36px" id="artIcon">🔥</div>
</div>
<div id="playerWrap" class="show">
<div id="ytPlayer"></div>
</div>
<div style="font-size:12px;font-weight:800;text-align:center;opacity:0.7;margin-top:10px">▶ Tap any track below to play REAL official video + audio!</div>
<div class="controls">
<button class="c-btn" onclick="prev()">⏮</button>
<button class="play-btn" onclick="togglePlay()" id="playBtn">⏸️</button>
<button class="c-btn" onclick="next()">⏭</button>
</div>
</div>
<div class="section">
<div class="section-title">🔥 REAL HITS - OFFICIAL VIDEOS</div>
<div id="trackList"></div>
<div style="background:#FFD700;color:black;border-radius:12px;padding:12px;margin-top:14px;font-weight:800;font-size:13px">
✅ V3 FIXED: REAL songs from YouTube Official! No more demo beats. Tap = Real Audio + Video!
</div>
</div>
<div class="bottom-nav">
<div class="nav-item active">🏠 Home</div>
<div class="nav-item">🎵 Music</div>
<div class="nav-item">♡ Fav</div>
<div class="nav-item">◎ You</div>
</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const tracks = [
{title:"Mnike",artist:"Tyler ICU & Tumelo.za ft Maphorisa",icon:"🔥",yt:"g_hgm2Mf6Ag"},
{title:"Dalie",artist:"Kamo Mphela x Tyler ICU",icon:"💃",yt:"Vbi4ZLIEgP4"},
{title:"Manzi Nte",artist:"Tyler ICU - Hit of Summer",icon:"🎹",yt:"Ypzwajk02Yw"},
{title:"Government",artist:"Tyler ICU Amapiano",icon:"🇿🇦",yt:"nn10_2As6cs"},
{title:"Banyana - Izolo",artist:"DJ Maphorisa & Tyler ICU",icon:"💰",yt:"f0PRbO_Afbw"},
{title:"Work Fada",artist:"Tiwa Savage ft Nas",icon:"🪘",yt:"sueFGcjtfyM"},
{title:"Imali ye Qolo",artist:"Tman Xpress & Tyler ICU",icon:"💵",yt:"9mg8hA98E7M"},
];
let cur=0;
let player;
let isPlaying=true;
function onYouTubeIframeAPIReady(){
 player = new YT.Player('ytPlayer', {
  height:'220',
  width:'100%',
  videoId: tracks[0].yt,
  playerVars:{playsinline:1, modestbranding:1, rel:0},
  events:{
   'onReady': (e)=>{ e.target.playVideo(); },
   'onStateChange': onState
  }
 });
}
function onState(e){
 if(e.data==1){ document.getElementById('playBtn').textContent='⏸️'; isPlaying=true; }
 if(e.data==2){ document.getElementById('playBtn').textContent='▶️'; isPlaying=false; }
}
function render(){
 const list=document.getElementById('trackList');
 list.innerHTML='';
 tracks.forEach((t,i)=>{
  const d=document.createElement('div');
  d.className='track'+(i===cur?' active':'');
  d.innerHTML=`<div class="track-num">${i+1}</div><div class="track-info"><div class="track-name">${t.icon} ${t.title} <span class="badge">REAL</span></div><div class="track-artist">${t.artist}</div></div><div>▶️</div>`;
  d.onclick=()=>play(i);
  list.appendChild(d);
 });
 document.getElementById('curTitle').textContent=tracks[cur].title;
 document.getElementById('curArtist').textContent=tracks[cur].artist;
 document.getElementById('artIcon').textContent=tracks[cur].icon;
}
function play(i){
 cur=i;
 render();
 if(player && player.loadVideoById){
  player.loadVideoById(tracks[i].yt);
 }
 document.getElementById('playerWrap').classList.add('show');
 window.scrollTo({top:0,behavior:'smooth'});
}
function togglePlay(){
 if(!player) return;
 if(isPlaying){ player.pauseVideo(); } else { player.playVideo(); }
}
function next(){ cur=(cur+1)%tracks.length; play(cur); }
function prev(){ cur=(cur-1+tracks.length)%tracks.length; play(cur); }
render();
</script>
</body>
 </html>
