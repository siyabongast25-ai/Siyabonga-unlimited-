<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIYABONGA UNLIMITED - 20 SONGS v13</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;overflow:hidden}
.header{padding:12px 14px;background:#121212;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.logo{font-weight:900;font-size:20px}.logo span{color:#1DB954}
.badge{background:#1DB954;color:#000;font-size:10px;font-weight:900;padding:4px 8px;border-radius:12px}
.search{margin:10px 12px;background:#232323;border-radius:25px;display:flex;align-items:center;padding:0 14px;height:44px}
.search input{flex:1;background:0;border:0;color:#fff;outline:0;font-size:14px}
.gbar{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.g{padding:7px 14px;background:#222;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid #333}
.g.active{background:#1DB954;color:#000}
.now{margin:0 12px 8px;background:linear-gradient(135deg,#1DB954,#1a1a1a);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center}
.now img{width:52px;height:52px;border-radius:8px}
.list{height:calc(100vh - 210px);overflow-y:auto;padding:0 12px 100px}
.song{display:flex;gap:10px;padding:11px;border-radius:10px;align-items:center;border:1px solid transparent}
.song.active{background:#1a1a1a;border-color:#1DB954}
.song img{width:48px;height:48px;border-radius:6px}
.song h3{font-size:13.5px;width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song p{font-size:11px;color:#aaa}
.btns{margin-left:auto;display:flex;gap:6px}
.b{width:32px;height:32px;border-radius:50%;border:0;font-size:14px;display:flex;align-items:center;justify-content:center}
.b.play{background:#1DB954;color:#000}
.b.down{background:#333;color:#fff}
.player{position:fixed;bottom:0;left:0;right:0;background:#181818;border-top:1px solid #2a2a2a;padding:8px 12px}
</style>
</head>
<body>
<div class="header"><div class="logo">SIYABONGA <span>UNLIMITED</span></div><div class="badge">20 SONGS v13</div></div>

<div class="search">🔍 <input id="q" oninput="searchNow()" placeholder="Search 20 songs: Mnike, Tyla, Kabza, Drake..."></div>

<div class="gbar" id="gbar">
<div class="g active" onclick="filterG('all',this)">All 20</div>
<div class="g" onclick="filterG('amapiano',this)">Amapiano</div>
<div class="g" onclick="filterG('afro',this)">Afro</div>
<div class="g" onclick="filterG('gqom',this)">Gqom</div>
<div class="g" onclick="filterG('house',this)">House</div>
<div class="g" onclick="filterG('hiphop',this)">HipHop</div>
</div>

<div class="now">
<img id="nImg" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=100">
<div style="flex:1;overflow:hidden"><h4 id="nTitle" style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Tap a song to play</h4><p id="nArtist" style="font-size:11px;opacity:.8">20 tracks ready</p></div>
<div style="font-size:22px" onclick="nextSong()">⏭️</div>
</div>

<div class="list" id="list"></div>

<div class="player">
<audio id="aud" controls style="width:100%;height:36px" onended="nextSong()"></audio>
</div>

<script>
const songs=[
{title:"Mnike",artist:"Tyler ICU x Tumelo_za",genre:"amapiano",img:"https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=200"},
{title:"Dalie",artist:"Kamo Mphela",genre:"amapiano",img:"https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?w=200"},
{title:"Tshwala Bam",artist:"TitoM & Yuppe",genre:"amapiano",img:"https://images.unsplash.com/photo-1493676304819-0d7a8d026dcf?w=200"},
{title:"Water",artist:"Tyla",genre:"afro",img:"https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200"},
{title:"Imithandazo",artist:"Kabza De Small",genre:"amapiano",img:"https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=200"},
{title:"iPlan",artist:"Dlala Thukzin",genre:"gqom",img:"https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=200"},
{title:"Jerusalema",artist:"Master KG",genre:"house",img:"https://images.unsplash.com/photo-1516450360452-9312abbf6f7e?w=200"},
{title:"Osama",artist:"Zakes Bantwini",genre:"house",img:"https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=200"},
{title:"AmaPiano",artist:"Aymos",genre:"amapiano",img:"https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=200"},
{title:"Soweto",artist:"Victony x Tempoe",genre:"afro",img:"https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=200"},
{title:"God's Plan",artist:"Drake",genre:"hiphop",img:"https://images.unsplash.com/photo-1493676304819-0d7a8d026dcf?w=200"},
{title:"Not Like Us",artist:"Kendrick Lamar",genre:"hiphop",img:"https://images.unsplash.com/photo-1478737270239-2f02b77fc618?w=200"},
{title:"Calm Down",artist:"Rema",genre:"afro",img:"https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=200"},
{title:"Mama",artist:"Mawhoo",genre:"amapiano",img:"https://images.unsplash.com/photo-1516450360452-9312abbf6f7e?w=200"},
{title:"Stimela",artist:"2woshort x Stompiiey",genre:"amapiano",img:"https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=200"},
{title:"Umbayimbayi",artist:"Sjava",genre:"afro",img:"https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=200"},
{title:"Mali",artist:"Mthandeni SK",genre:"gqom",img:"https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=200"},
{title:"Yebo Lapho",artist:"Siyabonga Special",genre:"amapiano",img:"https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=200"},
{title:"Feel",artist:"Davido",genre:"afro",img:"https://images.unsplash.com/photo-1493676304819-0d7a8d026dcf?w=200"},
{title:"Sondela",artist:"Mthunzi",genre:"amapiano",img:"https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=200"}
];
let cur=0, filtered=[...songs];
const aud=document.getElementById('aud');
function getSrc(i){return `https://www.soundhelix.com/examples/mp3/SoundHelix-Song-${(i%15)+1}.mp3`;}
function render(){
const L=document.getElementById('list'); L.innerHTML='';
filtered.forEach(s=>{
const idx=songs.indexOf(s);
L.innerHTML+=`<div class="song ${idx===cur?'active':''}"><img src="${s.img}"><div style="flex:1"><h3>${s.title}</h3><p>${s.artist}</p></div><div class="btns"><button class="b play" onclick="playSong(${idx})">▶️</button><button class="b down" onclick="downloadSong(${idx})">⬇️</button></div></div>`;
});
}
function playSong(i){
cur=i; let s=songs[cur];
document.getElementById('nImg').src=s.img;
document.getElementById('nTitle').textContent=s.title;
document.getElementById('nArtist').textContent=s.artist;
aud.src=getSrc(cur); aud.play();
render();
}
function downloadSong(i){
let s=songs[i]; let url=getSrc(i);
let a=document.createElement('a'); a.href=url; a.download=`${s.title}-${s.artist}.mp3`;
document.body.appendChild(a); a.click(); document.body.removeChild(a);
alert(`⬇️ Downloading: ${s.title} - ${s.artist}\nCheck your Downloads folder!`);
}
function nextSong(){ cur=(cur+1)%songs.length; playSong(cur); }
function searchNow(){
let q=document.getElementById('q').value.toLowerCase();
filtered=songs.filter(s=>s.title.toLowerCase().includes(q)||s.artist.toLowerCase().includes(q));
render();
}
function filterG(g,el){
document.querySelectorAll('.g').forEach(x=>x.classList.remove('active')); el.classList.add('active');
if(g==='all') filtered=[...songs]; else filtered=songs.filter(s=>s.genre===g);
render();
}
render();
</script>
</body>
                                                   </html>
