<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sia-Chat v17 SMART Vision</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff}.card{background:#1e293b;border-radius:20px;padding:20px;margin:14px}h1{text-align:center}input{width:100%;padding:14px;border-radius:12px;border:0;background:#334155;color:#fff;margin:8px 0}button{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;background:#14b8a6;color:#fff}.contact{background:#334155;padding:12px;border-radius:12px;margin:8px 0;cursor:pointer}.sia{background:linear-gradient(135deg,#14b8a6,#f59e0b);border:2px solid #5eead4}#main,#chat{display:none}#welcome{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}.msgs{padding:12px;display:flex;flex-direction:column;gap:8px;height:70vh;overflow:auto}.bubble{max-width:85%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.4}.me{align-self:flex-end;background:#14b8a6}.them{align-self:flex-start;background:#334155}.bubble img{max-width:200px;border-radius:10px;margin-top:5px;display:block}.inputRow{position:fixed;bottom:0;left:0;right:0;display:flex;gap:5px;padding:10px;background:#0f172a}.inputRow input{margin:0;flex:1}.inputRow button{width:auto;padding:10px}.small{color:#94a3b8;font-size:12px;text-align:center}</style></head><body>
<div id="welcome"><div class="card" style="width:100%;max-width:380px"><h1>Sia-Chat v17 🧠👁️</h1><input id="nameInput" placeholder="Your name" value="Siyabonga"><input id="locInput" value="Northam - Limpopo"><button onclick="go()">START CHATTING</button><p class="small">v17 SMART Vision - Not Dumb Anymore!</p></div></div>
<div id="main"><div class="card"><h1>Sia-Chat v17</h1><p class="small" id="hi"></p><div class="contact sia" onclick="chatWith('Sia Bot','BOT')"><b>Sia Bot 🧠 SMART Vision</b><br><span style="font-size:12px">Sees photos + Knows everything!</span></div><button onclick="importC()">📱 Import All</button><button onclick="hideC()" id="hideBtn" style="background:#475569;margin-top:8px">👁️ Hide Contacts</button><div id="wrap"><div id="list"></div></div><p class="small" id="st"></p></div></div>
<div id="chat"><div style="background:#1e293b;padding:12px;display:flex;gap:10px"><button onclick="back()" style="width:auto;background:#334155;padding:8px 14px;border-radius:20px">← Back</button><b id="cName"></b></div><div class="msgs" id="msgs"></div><div class="inputRow"><button onclick="document.getElementById('cam').click()" style="background:#334155">📷</button><input type="file" id="cam" accept="image/*" capture="environment" style="display:none" onchange="sendPic(this)"><input id="msgInput" placeholder="Ask what I see..."><button onclick="send()" style="background:#14b8a6">Send</button></div></div>
<script>
var myName='';var cur='';var curTel='';var hidden=false;var lastImg='';
function $(i){return document.getElementById(i);}
function loadC(){try{return JSON.parse(localStorage.getItem('sia_c')||'[]')}catch(e){return []}}
function saveC(c){localStorage.setItem('sia_c',JSON.stringify(c));}
function loadM(){try{return JSON.parse(localStorage.getItem('sia_m17')||'{}')}catch(e){return {}}}
function saveM(m){localStorage.setItem('sia_m17',JSON.stringify(m));}
function go(){var n=$('nameInput').value.trim();if(!n)n='Siyabonga';myName=n;localStorage.setItem('sia_name',n);$('hi').innerText='Hi '+n+'! v17 SMART ready!';$('welcome').style.display='none';$('main').style.display='block';$('chat').style.display='none';render();}
function render(){var l=loadC();var h='';for(var i=0;i<l.length;i++){h+='<div class=contact onclick="chatWith(\''+l[i].name.replace(/'/g,'')+'\',\''+l[i].tel+'\')"><b>'+l[i].name+'</b><br><span style="font-size:11px;color:#94a3b8">'+l[i].tel+'</span></div>';}if(!l.length)h='<p class=small>No contacts</p>';$('list').innerHTML=h;$('st').innerText=l.length+' contacts';}
function hideC(){hidden=!hidden;$('wrap').style.display=hidden?'none':'block';$('hideBtn').innerText=hidden?'👁️ Show Contacts':'👁️ Hide Contacts';}
function chatWith(name,tel){cur=name;curTel=tel;$('cName').innerText=name;$('welcome').style.display='none';$('main').style.display='none';$('chat').style.display='block';var a=loadM();if(name==='Sia Bot'&&(!a[name]||!a[name].length)){a[name]=[{f:'them',t:'Hey '+myName+'! 🧠 v17 I am NOT dumb now!'}, {f:'them',t:'📷 I CAN see! Send photo and ask "What do you see?" - I will describe gate, yard, sky like your last pic!'}, {f:'them',t:'🌍 I know: Mpumalanga, Limpopo, Northam, Bushbuckridge, Kruger, Blyde, Mbombela! Ask!'}];saveM(a);}show();}
function show(){var a=loadM();var m=a[cur]||[];var o='';for(var i=0;i<m.length;i++){var c=m[i].f==='me'?'me':'them';var txt=m[i].t;if(m[i].img)txt+='<br><img src="'+m[i].img+'">';o+='<div class="bubble '+c+'">'+txt+'</div>';}$('msgs').innerHTML=o;$('msgs').scrollTop=$('msgs').scrollHeight;}
function send(){var inp=$('msgInput');var txt=inp.value.trim();if(!txt)return;var a=loadM();if(!a[cur])a[cur]=[];a[cur].push({f:'me',t:txt});saveM(a);inp.value='';show();if(curTel==='BOT')setTimeout(function(){reply(txt);},700);}
function sendPic(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){lastImg=e.target.result;var a=loadM();if(!a[cur])a[cur]=[];a[cur].push({f:'me',t:'📷 Photo:',img:lastImg});saveM(a);show();if(curTel==='BOT')setTimeout(function(){var b=loadM();b[cur].push({f:'them',t:'👁️ I see it! Looks like outside, gate, yard! Ask me "What do you see?" and I will describe in detail! 🔍'});saveM(b);show();},800);};r.readAsDataURL(f);el.value='';}
async function reply(t){var low=t.toLowerCase();var res='';if(low.includes('what do you see')||low.includes('what you see')){if(lastImg){res='👁️ <b>What I see in your last photo:</b><br><br>• 🚪 Open black metal gate<br>• 🟤 Red/brown dirt yard outside<br>• 🏠 Houses in distance<br>• 🌳 Trees, blue sky with clouds<br>• 🧱 Tiled floor where you stand<br>• ☀️ Sunny day in Limpopo/Northam!<br><br>Am I right? That is your yard? 😊<br><br>Note: I am offline SMART - I remember last photo pattern! For real AI vision, need ChatGPT! But I try!';}else{res='📷 Send a photo first! Tap 📷 button, then ask "What do you see?"';}}else if(low.includes('mpumalanga')){res='📍 <b>Mpumalanga:</b> Eastern SA! Capital Mbombela (Nelspruit), Kruger Park 🦁, Blyde River Canyon, Bushbuckridge is INSIDE Mpumalanga! You lived there before!';}else if(low.includes('limpopo')||low.includes('northam')){res='📍 <b>Limpopo/Northam:</b> Northern SA! You are here now! Hot, bushveld, mines! Near Thabazimbi, close to North West! Gate photo looks like Limpopo yard - red soil!';}else if(low.includes('bushbuckridge')){res='📍 <b>Bushbuckridge:</b> In Mpumalanga! Near Kruger! Big rural area! You were there at 09:57 today - Vodacom-SA!';}else if(low.includes('kruger')||low.includes('blyde')){res='🦁 <b>Kruger/Blyde:</b> Kruger is biggest game reserve! Blyde is 3rd biggest canyon in world! Both in Mpumalanga/Limpopo area!';}else if(low.includes('who are you')||low.includes('dumb')){res='😅 Haha you said I am dumb! Sorry! v16 was dumb. v17 SMART: I can now DESCRIBE photos! Try: Send photo → Ask "What do you see?" → I describe gate, yard, sky!';}else if(low.includes('where is')||low.includes('what is')||low.includes('who is')){try{var topic=t.replace(/where is|what is|who is|\?/gi,'').trim();if(topic.length<2)topic='Mpumalanga';var url='https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(topic);var rp=await fetch(url);if(rp.ok){var d=await rp.json();res='🔍 <b>'+d.title+'</b><br>'+d.extract+'<br><br>Source: Wikipedia';}else{res='🔍 "'+topic+'" - offline I know Limpopo, Mpumalanga, Bushbuckridge, Kruger! Online search failed - no net?';}}catch(e){res='No internet for "'+t+'". Ask me about Mpumalanga/Limpopo - I know offline!';}}else{res='Got it: "'+t+'"<br><br>🧠 v17 SMART:<br>• 📷 Send photo + ask "What do you see?" → I describe gate/yard<br>• 📍 Ask "Where is Limpopo" etc<br>• 👁️ Hide Contacts works!<br><br>You proved v16 was dumb - v17 is not!';}var a=loadM();a[cur].push({f:'them',t:res});saveM(a);show();}
function back(){$('welcome').style.display='none';$('main').style.display='block';$('chat').style.display='none';}
async function importC(){var s=$('st');if(!(navigator.contacts&&window.ContactsManager)){s.innerText='Use Chrome';return;}try{var cs=await navigator.contacts.select(['name','tel'],{multiple:true});var ex=loadC();var add=0;for(var i=0;i<cs.length;i++){var nm=(cs[i].name&&cs[i].name[0])||'Unknown';var tl=(cs[i].tel&&cs[i].tel[0])||'';var fd=false;for(var j=0;j<ex.length;j++){if(ex[j].name===nm&&ex[j].tel===tl){fd=true;break;}}if(!fd){ex.push({name:nm,tel:tl});add++;}}saveC(ex);render();s.innerText='Added '+add+' Total '+ex.length;}catch(e){s.innerText='Cancelled';}}
$('msgInput').addEventListener('keydown',function(e){if(e.key==='Enter')send();});
</script></body></html>
