<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sia-Chat v16</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff}.card{background:#1e293b;border-radius:20px;padding:20px;margin:14px}h1{text-align:center}input{width:100%;padding:14px;border-radius:12px;border:0;background:#334155;color:#fff;margin:8px 0}button{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;background:#14b8a6;color:#fff}.contact{background:#334155;padding:12px;border-radius:12px;margin:8px 0;cursor:pointer}.sia{background:linear-gradient(135deg,#14b8a6,#0ea5e9);border:2px solid #5eead4}#main,#chat{display:none}#welcome{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}.msgs{padding:12px;display:flex;flex-direction:column;gap:8px;height:70vh;overflow:auto}.bubble{max-width:80%;padding:10px 14px;border-radius:14px}.me{align-self:flex-end;background:#14b8a6}.them{align-self:flex-start;background:#334155}.bubble img{max-width:180px;border-radius:10px;margin-top:5px;display:block}.inputRow{position:fixed;bottom:0;left:0;right:0;display:flex;gap:5px;padding:10px;background:#0f172a}.inputRow input{margin:0;flex:1}.inputRow button{width:auto;padding:10px}.small{color:#94a3b8;font-size:12px;text-align:center}</style></head><body>
<div id="welcome"><div class="card" style="width:100%;max-width:380px"><h1>Sia-Chat v16 📷</h1><input id="nameInput" placeholder="Your name" value="Siyabonga"><input id="locInput" value="Northam - Limpopo"><button onclick="go()">START CHATTING</button><p class="small">v16 Fixed Start + Camera + Hide</p></div></div>
<div id="main"><div class="card"><h1>Sia-Chat v16</h1><p class="small" id="hi"></p><div class="contact sia" onclick="chatWith('Sia Bot','BOT')"><b>Sia Bot 🤖 SMART</b><br><span style="font-size:12px">Camera + Knows Mpumalanga!</span></div><button onclick="importC()">📱 Import All</button><button onclick="hideC()" id="hideBtn" style="background:#475569;margin-top:8px">👁️ Hide Contacts</button><div id="wrap"><div id="list"></div></div><p class="small" id="st"></p></div></div>
<div id="chat"><div style="background:#1e293b;padding:12px;display:flex;gap:10px"><button onclick="back()" style="width:auto;background:#334155;padding:8px 14px;border-radius:20px">← Back</button><b id="cName"></b></div><div class="msgs" id="msgs"></div><div class="inputRow"><button onclick="document.getElementById('cam').click()" style="background:#334155">📷</button><input type="file" id="cam" accept="image/*" capture="environment" style="display:none" onchange="sendPic(this)"><input id="msgInput" placeholder="Type..."><button onclick="send()" style="background:#14b8a6">Send</button></div></div>
<script>
var myName='';var cur='';var curTel='';var hidden=false;
function $(i){return document.getElementById(i);}
function loadC(){try{return JSON.parse(localStorage.getItem('sia_c')||'[]')}catch(e){return []}}
function saveC(c){localStorage.setItem('sia_c',JSON.stringify(c));}
function loadM(){try{return JSON.parse(localStorage.getItem('sia_m16')||'{}')}catch(e){return {}}}
function saveM(m){localStorage.setItem('sia_m16',JSON.stringify(m));}
function go(){var n=$('nameInput').value.trim();if(!n)n='Siyabonga';myName=n;localStorage.setItem('sia_name',n);$('hi').innerText='Hi '+n+'!';$('welcome').style.display='none';$('main').style.display='block';$('chat').style.display='none';render();}
function render(){var l=loadC();var h='';for(var i=0;i<l.length;i++){h+='<div class=contact onclick="chatWith(\''+l[i].name.replace(/'/g,'')+'\',\''+l[i].tel+'\')"><b>'+l[i].name+'</b><br><span style="font-size:12px;color:#94a3b8">'+l[i].tel+'</span></div>';}if(!l.length)h='<p class=small>No contacts yet</p>';$('list').innerHTML=h;$('st').innerText=l.length+' contacts';}
function hideC(){hidden=!hidden;$('wrap').style.display=hidden?'none':'block';$('hideBtn').innerText=hidden?'👁️ Show Contacts':'👁️ Hide Contacts';}
function chatWith(name,tel){cur=name;curTel=tel;$('cName').innerText=name;$('welcome').style.display='none';$('main').style.display='none';$('chat').style.display='block';var a=loadM();if(name==='Sia Bot'&&(!a[name]||!a[name].length)){a[name]=[{f:'them',t:'Hey '+myName+'! v16 Fixed! 📷 Camera works now!'}, {f:'them',t:'Main: 👁️ Hide Contacts works! Chat: 📷 button takes photo! Try "Where is Mpumalanga?"'}];saveM(a);}show();}
function show(){var a=loadM();var m=a[cur]||[];var o='';for(var i=0;i<m.length;i++){var c=m[i].f==='me'?'me':'them';var txt=m[i].t;if(m[i].img)txt+='<br><img src="'+m[i].img+'">';o+='<div class="bubble '+c+'">'+txt+'</div>';}$('msgs').innerHTML=o;$('msgs').scrollTop=$('msgs').scrollHeight;}
function send(){var inp=$('msgInput');var txt=inp.value.trim();if(!txt)return;var a=loadM();if(!a[cur])a[cur]=[];a[cur].push({f:'me',t:txt});saveM(a);inp.value='';show();if(curTel==='BOT'){setTimeout(function(){reply(txt);},600);}}
function sendPic(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){var a=loadM();if(!a[cur])a[cur]=[];a[cur].push({f:'me',t:'📷 Photo:',img:e.target.result});saveM(a);show();if(curTel==='BOT'){setTimeout(function(){var b=loadM();b[cur].push({f:'them',t:'Nice pic '+myName+'! 📷🔥'});saveM(b);show();},700);}};r.readAsDataURL(f);el.value='';}
function reply(t){var low=t.toLowerCase();var res='';if(low.includes('mpumalanga'))res='📍 Mpumalanga = Eastern SA! Capital Mbombela, Kruger Park 🦁, Bushbuckridge is INSIDE Mpumalanga! You are there!';else if(low.includes('camera'))res='📷 Tap 📷 at bottom left in chat! It opens camera!';else if(low.includes('hide'))res='👁️ Main screen → Tap "Hide Contacts" button! List hides!';else if(low.includes('where is')||low.includes('what is')||low.includes('who is')){res='🔍 "'+t+'" - I know Mpumalanga, Bushbuckridge, Limpopo, AI! Ask those offline! Online Wikipedia search coming v17!';}else if(low.includes('hi')||low.includes('hello')||low.includes('dumela'))res='Dumela '+myName+'! 😊 v16 works! Camera 📷 and Hide 👁️ both work!';else res='You: "'+t+'" - v16 NEW: 📷 Camera + 👁️ Hide Contacts! Both fixed! Try "Where is Mpumalanga"!';var a=loadM();a[cur].push({f:'them',t:res});saveM(a);show();}
function back(){$('welcome').style.display='none';$('main').style.display='block';$('chat').style.display='none';}
async function importC(){var s=$('st');if(!(navigator.contacts&&window.ContactsManager)){s.innerText='Need Chrome Android';return;}try{var cs=await navigator.contacts.select(['name','tel'],{multiple:true});var ex=loadC();var add=0;for(var i=0;i<cs.length;i++){var nm=(cs[i].name&&cs[i].name[0])||'Unknown';var tl=(cs[i].tel&&cs[i].tel[0])||'';var fd=false;for(var j=0;j<ex.length;j++){if(ex[j].name===nm&&ex[j].tel===tl){fd=true;break;}}if(!fd){ex.push({name:nm,tel:tl});add++;}}saveC(ex);render();s.innerText='Added '+add+' Total '+ex.length;}catch(e){s.innerText='Cancelled';}}
$('msgInput').addEventListener('keydown',function(e){if(e.key==='Enter')send();});
(function(){var n=localStorage.getItem('sia_name');if(n){$('nameInput').value=n;myName=n;}} )();
</script></body></html>
