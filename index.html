<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIA CHAT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0f1f25;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1e333b;width:100%;max-width:380px;border-radius:20px;padding:28px;text-align:center}
h1{color:#0dbd8a;letter-spacing:2px;margin-bottom:20px}
input{width:100%;padding:15px;border-radius:12px;border:none;background:#2a444e;color:#fff;font-size:17px;outline:none;margin-bottom:12px}
button{width:100%;padding:15px;border-radius:12px;border:none;background:#0dbd8a;color:#fff;font-size:17px;font-weight:700}
#chatScreen{display:none;width:100%;max-width:480px;height:90vh;flex-direction:column;background:#1e333b;border-radius:18px;overflow:hidden}
#header{background:#0dbd8a;padding:14px;font-weight:700;display:flex;justify-content:space-between}
#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{background:#2a444e;padding:11px 14px;border-radius:14px;max-width:80%;align-self:flex-start;text-align:left}
.msg.me{background:#0dbd8a;align-self:flex-end}
#inputArea{display:flex;gap:8px;padding:12px;background:#162a31}
#inputArea input{margin:0;flex:1}
#inputArea button{width:80px}
</style>
</head>
<body>
<div class="card" id="loginCard">
<h1>SIA CHAT</h1>
<input id="nameInput" type="text" placeholder="Enter your name" value="Siyabonga">
<button onclick="startChat()">Start Chatting</button>
<p style="margin-top:12px;color:#8aa0a8;font-size:12px">Fixed version - will work! 🚀</p>
</div>
<div id="chatScreen">
<div id="header"><span id="headerName">SIA CHAT</span><span onclick="location.reload()" style="cursor:pointer">Logout</span></div>
<div id="messages"></div>
<div id="inputArea">
<input id="msgInput" type="text" placeholder="Type message...">
<button onclick="sendMsg()">Send</button>
</div>
</div>
<script>
let userName="";
function startChat(){
let v=document.getElementById('nameInput').value.trim();
if(!v){alert('Enter name');return;}
userName=v;
document.getElementById('loginCard').style.display='none';
document.getElementById('chatScreen').style.display='flex';
document.getElementById('headerName').innerText='Hi, '+userName+' 👋';
addMsg('Welcome '+userName+'! Your site is LIVE! 🎉',false);
}
function addMsg(t,me){
let d=document.createElement('div');
d.className=me?'msg me':'msg';
d.textContent=t;
let m=document.getElementById('messages');
m.appendChild(d);
m.scrollTop=9999;
}
function sendMsg(){
let i=document.getElementById('msgInput');
let t=i.value.trim();
if(!t)return;
addMsg(t,true);
i.value='';
setTimeout(()=>{addMsg('SIA CHAT working! 🚀',false)},500);
}
