<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIYABONGA UNLIMITED</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:'Outfit',sans-serif}
.glow{box-shadow:0 0 30px rgba(255,215,0,0.4)}
.beat{animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
</style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen">
<div class="p-5 flex justify-between items-center">
<h1 class="text-2xl font-black">SIYABONGA<span class="text-yellow-400"> UNLIMITED</span></h1>
<div class="w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center text-black font-bold">S</div>
</div>
<div class="mx-4 bg-gradient-to-br from-yellow-400 to-orange-600 rounded-[28px] p-6 text-black">
<div class="flex justify-between">
<div>
<p class="text-xs font-bold tracking-widest opacity-70">NOW PLAYING</p>
<h2 id="nowTitle" class="text-2xl font-black mt-1">Amapiano Unlimited</h2>
<p id="nowArtist" class="font-bold opacity-80">Siyabonga Mix • Vol 1</p>
</div>
<div class="w-16 h-16 bg-black rounded-2xl flex items-center justify-center beat">
<span class="text-2xl">🔥</span>
</div>
</div>
<div class="mt-6">
<div class="w-full bg-black/20 h-2 rounded-full">
<div id="progress" class="bg-black h-2 rounded-full w-[35%] transition-all duration-500"></div>
</div>
<div class="flex justify-between text-xs font-bold mt-2">
<span>0:42</span><span>3:24</span>
</div>
</div>
<div class="flex justify-center gap-6 mt-6 items-center">
<button class="w-12 h-12 bg-black/20 rounded-full font-bold">⏮</button>
<button id="playBtn" class="w-20 h-20 bg-black text-white rounded-full text-3xl glow">▶</button>
<button class="w-12 h-12 bg-black/20 rounded-full font-bold">⏭</button>
</div>
</div>
<div class="p-4">
<h3 class="font-black text-lg mb-3">UNLIMITED VIBES</h3>
<div class="grid grid-cols-2 gap-3">
<div onclick="playSong('Amapiano','Kabza De Small')" class="bg-[#1a1a1a] rounded-2xl p-4 border border-white/10">
<p class="text-2xl">🎹</p><p class="font-black mt-2">Amapiano</p><p class="text-xs opacity-60">128 tracks</p>
</div>
<div onclick="playSong('Afro House','Black Coffee')" class="bg-[#1a1a1a] rounded-2xl p-4 border border-white/10">
<p class="text-2xl">🪘</p><p class="font-black mt-2">Afro House</p><p class="text-xs opacity-60">96 tracks</p>
</div>
<div onclick="playSong('Gqom','Distruction Boyz')" class="bg-[#1a1a1a] rounded-2xl p-4 border border-white/10">
<p class="text-2xl">💃</p><p class="font-black mt-2">Gqom</p><p class="text-xs opacity-60">74 tracks</p>
</div>
<div onclick="playSong('Hip Hop SA','Nasty C')" class="bg-[#1a1a1a] rounded-2xl p-4 border border-white/10">
<p class="text-2xl">🎤</p><p class="font-black mt-2">SA Hip Hop</p><p class="text-xs opacity-60">112 tracks</p>
</div>
</div>
</div>
<div class="p-4 pb-24">
<h3 class="font-black text-lg mb-3">TRENDING NOW - SA</h3>
<div id="playlist" class="space-y-3"></div>
</div>
<div class="fixed bottom-0 left-0 right-0 bg-[#141414] border-t border-white/10 p-3 flex justify-around">
<button class="text-yellow-400 font-black">⌂ Home</button>
<button class="opacity-50">♫ Music</button>
<button class="opacity-50">♡ Fav</button>
<button class="opacity-50">◉ You</button>
</div>
<script>
const songs=[
{title:"Mnike",artist:"Tyler ICU & Tumelo",emoji:"🔥"},
{title:"Imnandi Lange",artist:"Mawhoo",emoji:"💛"},
{title:"iPlan",artist:"Dlala Thukzin",emoji:"🎹"},
{title:"Yahyuppiyah",artist:"Uncle Waffles",emoji:"💃"},
{title:"AmaShooter",artist:"Siyabonga Unlimited Mix",emoji:"🚀"},
];
const list=document.getElementById('playlist');
songs.forEach((s,i)=>{
list.innerHTML+=`<div onclick="playSong('${s.title}','${s.artist}')" class="flex items-center gap-4 bg-[#1a1a1a] p-3 rounded-2xl">
<div class="w-12 h-12 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-xl flex items-center justify-center text-xl">${s.emoji}</div>
<div class="flex-1"><p class="font-bold">${s.title}</p><p class="text-xs opacity-60">${s.artist}</p></div>
<div class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center">▶</div>
</div>`;
});
let playing=false;
function playSong(t,a){
document.getElementById('nowTitle').innerText=t;
document.getElementById('nowArtist').innerText=a;
playing=true;
document.getElementById('playBtn').innerText='⏸';
}
document.getElementById('playBtn').onclick=()=>{
playing=!playing;
document.getElementById('playBtn').innerText=playing?'⏸':'▶';
};
</script>
</body>
  </html>
