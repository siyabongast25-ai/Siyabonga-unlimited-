<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SIA CHAT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#111b21;color:#e9edef;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{background:#202c33;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header h1{font-size:18px;letter-spacing:1px}
#welcome{position:fixed;inset:0;background:#111b21;display:flex;align-items:center;justify-content:center;z-index:100}
.card{background:#202c33;padding:25px;border-radius:12px;width:90%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.card h2{text-align:center;margin-bottom:15px;color:#00a884}
.card input{width:100%;padding:12px;border-radius:8px;border:none;background:#2a3942;color:#fff;font-size:16px;margin:10px 0;outline:none}
.card button{width:100%;padding:12px;border:none;border-radius:8px;background:#00a884;color:#fff;font-size:16px;font-weight:600;margin-top:10px}
#main{display:none;flex-direction:column;height:100vh}
.contacts{flex:1;overflow-y:auto;background:#111b21}
.contact{padding:12px 15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222d34;cursor:pointer}
.contact:active{background:#202c33}
.avatar{width:45px;height:45px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:18px}
#chat{position:fixed;inset:0;background:#0b141a;display:none;flex-direction:column;z-index:20}
#chatHeader{background:#202c33;padding:10px 12px;display:flex;align-items:center;gap:10px}
#chatHeader button{background:none;border:none;color:#fff;font-size:20px}
#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px;background:#0b141a}
.msg{max-width:75%;padding:8px 10px;border-radius:8px;font-size:14.5px;line-height:19px;position:relative;word-wrap:break-word}
.sent{align-self:flex-end;background:#005c4b;color:#e9edef;border-top-right-radius:0}
.recv{align-self:flex-start;background:#202c33;color:#e9edef;border-top-left-radius:0}
.msg small{display:block;font-size:11px;opacity:.6;text-align:right;margin-top:4px}
.loc{color:#53bdeb;text-decoration:none}
#inputBar{background:#202c33;padding:8px 10px;display:flex;align-items:center;gap:8px}
#inputBar input{flex:1;padding:10px 14px;border-radius:20px;border:none;background:#2a3942;color:#fff;outline:none;font-size:15px}
#inputBar button{width:42px;height:42px;border-radius:50%;border:none;background:#00a884;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
#inputBar .locBtn{background:#2a3942;font-size:18px}
.topActions{display:flex;gap:8px;padding:10px}
.topActions button{flex:1;padding:10px;border:none;border-radius:8px;background:#2a3942;color:#fff}
</style>
</head>
<body>
<div id="welcome">
  <div class="card">
    <h2>SIA CHAT</h2>
    <input id="nameInput" placeholder="Enter your name">
    <button onclick="go()">Start Chatting</button>
  </div>
</div>
<div id="main">
  <header><h1>SIA CHAT</h1><button onclick="addManual()" style="background:none;border:none;color:#00a884;font-size:22px">＋</button></header>
  <div class="topActions"><button onclick="hideC()">Hide/Show</button><button onclick="clearAll()">Clear</button></div>
  <div id="contactList" class="contacts"></div>
</div>
<div id="chat">
  <div id="chatHeader"><button onclick="closeChat()">←</button><div class="avatar" id="chatAvatar">A</div><div><div id="chatName">Name</div><div style="font-size:12px;opacity:.7">accurate GPS on</div></div></div>
  <div id="messages"></div>
  <div id="inputBar"><button class="locBtn" onclick="sendLocation()">📍</button><input id="msgInput" placeholder="Type message" onkeydown="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">➤</button></div>
</div>
<script>
var myName='';var cur='';var curTel='';var hidden=false;
function $(i){return document.getElementById(i)}
function loadC(){try{return JSON.parse(localStorage.getItem('sia_contacts')||'[]')}catch(e){return []}}
function saveC(c){localStorage.setItem('sia_contacts',JSON.stringify(c))}
function loadM(){try{return JSON.parse(localStorage.getItem('sia_msgs')||'{}')}catch(e){return {}}}
function saveM(m){localStorage.setItem('sia_msgs',JSON.stringify(m))}
function go(){var n=$('nameInput').value.trim();if(!n){alert('Enter name');return}myName=n;localStorage.setItem('sia_myname',n);$('welcome').style.display='none';$('main').style.display='flex';render()}
function render(){var l=loadC();var h='';for(var i=0;i<l.length;i++){var c=l[i];h+='<div class=contact onclick="openChat(\''+c.name.replace(/'/g,'\\\'')+'\')"><div class=avatar>'+c.name.charAt(0).toUpperCase()+'</div><div style=flex:1><div style=font-weight:500>'+c.name+'</div><div style=font-size:12px;opacity:.6>'+ (c.tel||'') +'</div></div></div>'}if(l.length==0)h='<div style=padding:30px;text-align:center;opacity:.6>No contacts yet<br>Tap + to add</div>';$('contactList').innerHTML=h;if(hidden)$('contactList').style.display='none';else $('contactList').style.display='block'}
function hideC(){hidden=!hidden;render()}
function addManual(){var n=prompt('Name:');if(!n)return;var t=prompt('Phone:')||'';var l=loadC();l.push({name:n,tel:t});saveC(l);render()}
function openChat(name){cur=name;$('chatName').innerText=name;$('chatAvatar').innerText=name.charAt(0).toUpperCase();$('chat').style.display='flex';renderMsgs()}
function closeChat(){cur='';$('chat').style.display='none'}
function renderMsgs(){var all=loadM();var arr=all[cur]||[];var html='';for(var i=0;i<arr.length;i++){var m=arr[i];var cls=m.from===myName?'msg sent':'msg recv';var time=new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(m.text.indexOf('__LOC__')===0){var p=m.text.replace('__LOC__','').split('|');var lat=p[0],lng=p[1],acc=p[2];var mapUrl='https://www.google.com/maps?q='+lat+','+lng;html+='<div class='+cls+'><a class=loc href='+mapUrl+' target=_blank>📍 Live Location<br><small>Lat:'+parseFloat(lat).toFixed(6)+' Lng:'+parseFloat(lng).toFixed(6)+'<br>Accuracy: '+acc+'m - Tap to open Maps</small></a><small>'+time+' ✓✓</small></div>';}else{html+='<div class='+cls+'>'+m.text.replace(/</g,'&lt;')+'<small>'+time+' ✓✓</small></div>'}}$('messages').innerHTML=html;$('messages').scrollTop=$('messages').scrollHeight}
function sendMsg(){var t=$('msgInput').value.trim();if(!t||!cur)return;var all=loadM();if(!all[cur])all[cur]=[];all[cur].push({from:myName,text:t,time:Date.now()});saveM(all);$('msgInput').value='';renderMsgs()}

 if(!cur){alert('Open a chat first');return}
 if(!navigator.geolocation){alert('Geolocation not supported');return}
 $('messages').innerHTML+='<div class=msg sent style=opacity:.6>Getting accurate location... High accuracy GPS ON</div>';$('messages').scrollTop=$('messages').scrollHeight;
 var opts={enableHighAccuracy:true,timeout:20000,maximumAge:0};
 navigator.geolocation.getCurrentPosition(function(pos){

  var all=loadM();if(!all[cur])all[cur]=[];all[cur].push({from:myName,text:'__LOC__'+lat+'|'+lng+'|'+acc,time:Date.now()});saveM(all);renderMsgs();
