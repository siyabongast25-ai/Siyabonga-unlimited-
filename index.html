<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Segoe UI,Arial;background:#111b21;color:#e9edef;height:100dvh;overflow:hidden}.hidden{display:none!important}#login{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b141a;color:#fff;padding:24px}#login input{padding:14px 18px;border-radius:24px;border:0;width:260px;margin-top:12px;text-align:center;background:#202c33;color:#fff;outline:0}#login button{margin-top:16px;background:#00a884;color:#111b21;padding:12px 36px;border:0;border-radius:24px;font-weight:700;font-size:16px} .app{height:100dvh;display:flex;flex-direction:column} .header{background:#202c33;padding:10px 14px;display:flex;align-items:center;gap:12px;color:#e9edef;flex-shrink:0} .header .back{font-size:22px;cursor:pointer;padding:6px 10px} .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;flex-shrink:0} .contacts{flex:1;overflow:auto;background:#111b21} .contact{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #222d34;cursor:pointer} .contact:hover{background:#202c33} .contact b{color:#e9edef} .contact small{color:#8696a0} .chat{flex:1;overflow:auto;padding:12px;background:#0b141a} .msg{max-width:78%;padding:8px 10px;border-radius:8px;margin:6px 0;font-size:14.5px;line-height:19px;box-shadow:0 1px .5px rgba(0,0,0,.5);white-space:pre-wrap;word-break:break-word} .me{background:#005c4b;color:#e9edef;margin-left:auto;border-top-right-radius:0} .bot{background:#202c33;color:#e9edef;margin-right:auto;border-top-left-radius:0} .bar{background:#202c33;padding:6px 8px;display:flex;gap:8px;align-items:center;flex-shrink:0} .bar input{flex:1;padding:12px 14px;border-radius:21px;border:0;background:#2a3942;color:#fff;outline:0} .bar button{border:0;width:46px;height:46px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer} .sendBtn{background:#00a884;color:#111b21} .imgBtn{background:#2a3942;color:#8696a0} .chat img{max-width:100%;border-radius:8px;margin-top:6px} .num{font-size:13px;color:#00a884} .importBtn{width:90%;margin:12px auto;display:block;background:#00a884;color:#111b21;border:0;padding:12px;border-radius:24px;font-weight:700}</style></head><body><div id="login"><h1 style="font-size:32px">Sia-Chat</h1><p style="color:#8696a0;margin-top:6px">Import Real Contacts</p><input id="name" placeholder="Your Name"><button onclick="go()">Start</button></div><div id="app" class="app hidden"><div id="contactsView" style="flex:1;display:flex;flex-direction:column;overflow:hidden"><div class="header"><span style="flex:1;font-size:19px;font-weight:600" id="hi">Chats</span><button onclick="addContact()" style="background:#2a3942;color:#fff;border:0;padding:8px 14px;border-radius:20px;font-weight:600">+ New</button></div><button class="importBtn" onclick="importAll()">📱 Import All From Phone</button><small style="text-align:center;color:#8696a0;padding:0 12px 8px">Tap to pick contacts from your phone - you can select many at once!</small><div class="contacts" id="contacts"></div></div><div id="chatView" class="hidden" style="flex:1;display:flex;flex-direction:column;overflow:hidden"><div class="header"><span class="back" onclick="showContacts()">←</span><div class="avatar" id="chatAvatar"></div><div style="flex:1"><div id="chatName" style="font-size:16px;font-weight:600"></div><small id="chatStatus" style="color:#00a884;font-size:12px">online</small><div id="chatNumber" class="num"></div></div><a id="callBtn" href="#" style="background:#00a884;color:#fff;padding:8px 12px;border-radius:20px;text-decoration:none;font-size:14px">📞</a></div><div class="chat" id="msgs"></div><div class="bar"><button class="imgBtn" onclick="document.getElementById('pic').click()">📷</button><input id="pic" type="file" accept="image/*" class="hidden" onchange="sendPic(event)"><input id="text" placeholder="Type a message"><button class="sendBtn" onclick="send()">➤</button></div></div></div><script>let colors=["#00a884","#128c7e","#54656f","#6b7c8d","#d38a3a","#8b5cf6","#e65a4f","#0b5e4b"];function colFor(n){let s=0;for(let i=0;i<n.length;i++)s+=n.charCodeAt(i);return colors[s%colors.length];}let raw=JSON.parse(localStorage.getItem('sia-contacts-v10')||localStorage.getItem('sia-contacts-v9')||localStorage.getItem('sia-contacts')||'["Sia-Bot"]');let contacts=raw.map(c=>typeof c==='string'?{name:c,number:c.includes('Sia-Bot')?'AI Bot':'+27 6'+Math.floor(10000000+Math.random()*90000000)}:c);function save(){localStorage.setItem('sia-contacts-v10',JSON.stringify(contacts));}function avatarCircle(name){return `<div class="avatar" style="background:${colFor(name)}">${name.trim()[0].toUpperCase()}</div>`;}function go(){let n=document.getElementById('name').value.trim();if(!n){alert('Enter name');return;}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('hi').innerText=n;render();}function render(){let h="";contacts.forEach((c,i)=>{h+=`<div class="contact" onclick="openChat(${i})">${avatarCircle(c.name)}<div style="flex:1"><b>${c.name}</b><br><small>${c.number}</small></div><small style="color:#8696a0">›</small></div>`;});document.getElementById('contacts').innerHTML=h;}let curIdx=0;function showContacts(){document.getElementById('chatView').classList.add('hidden');document.getElementById('contactsView').classList.remove('hidden');}function openChat(idx){curIdx=idx;let c=contacts[idx];document.getElementById('contactsView').classList.add('hidden');document.getElementById('chatView').classList.remove('hidden');document.getElementById('chatName').innerText=c.name;document.getElementById('chatNumber').innerText=c.number;document.getElementById('callBtn').href='tel:'+c.number;let av=document.getElementById('chatAvatar');av.style.background=colFor(c.name);av.innerText=c.name.trim()[0].toUpperCase();document.getElementById('chatStatus').innerText='online';document.getElementById('msgs').innerHTML='';if(c.name.includes('Sia-Bot'))addMsg('Sia-Bot','Import works! Tap "Import All From Phone" to get real numbers!',0);}function addMsg(w,t,isMe){let d=document.createElement('div');d.className='msg '+(isMe?'me':'bot');d.innerHTML=isMe?t:`<b style="color:${colFor(w)};font-size:13px">${w}</b><br>`+t;document.getElementById('msgs').appendChild(d);document.getElementById('msgs').scrollTop=999999;}async function getRealAI(prompt){try{let res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt+' - short friendly under 100 words'));let txt=await res.text();return txt.slice(0,500);}catch(e){return 'AI offline!';}}async function send(){let i=document.getElementById('text');if(!i.value.trim())return;let v=i.value.trim();addMsg('You',v,1);i.value='';let c=contacts[curIdx];if(!c.name.includes('Sia-Bot')){document.getElementById('chatStatus').innerText='typing...';setTimeout(()=>{document.getElementById('chatStatus').innerText='online';addMsg(c.name,'Seen: '+v,0)},800);return;}let s=document.getElementById('chatStatus');s.innerText='typing...';let think=document.createElement('div');think.className='msg bot';think.id='think';think.innerText='typing...';document.getElementById('msgs').appendChild(think);let ans=await getRealAI(v);let th=document.getElementById('think');if(th)th.remove();s.innerText='online';addMsg('Sia-Bot',ans,0);}function sendPic(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(){addMsg('You',`<img src="${r.result}">`,1);};r.readAsDataURL(f);}function addContact(){let n=prompt('Contact name?');if(!n)return;let num=prompt('Phone number?');if(!num)num='+27 6'+Math.floor(10000000+Math.random()*90000000);contacts.push({name:n,number:num});save();render();}async function importAll(){if(!('contacts' in navigator && 'ContactsManager' in window)){alert('Your phone does not support auto-import. On Android Chrome it works. For now use + New to add manually.');return;}try{const props=['name','tel'];const opts={multiple:true};const picked=await navigator.contacts.select(props,opts);if(!picked.length)return;picked.forEach(p=>{let name=p.name&&p.name[0]?p.name[0]:'Unknown';let tel=p.tel&&p.tel[0]?p.tel[0]:'';if(!contacts.find(x=>x.name===name&&x.number===tel)){contacts.push({name:name,number:tel});}});save();render();alert('Imported '+picked.length+' contacts! 🔥');}catch(err){alert('Import cancelled or not allowed: '+err.message);}}</script></body></html>
