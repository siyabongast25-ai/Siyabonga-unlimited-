<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sia-Chat v15 Camera</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff}.card{background:#1e293b;border-radius:20px;padding:20px;margin:14px}h1{text-align:center}input{width:100%;padding:14px;border-radius:12px;border:0;background:#334155;color:#fff;margin:8px 0;font-size:16px}button{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;background:#14b8a6;color:#fff;cursor:pointer}.contact{background:#334155;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;cursor:pointer}.sia{background:linear-gradient(135deg,#14b8a6,#0ea5e9);border:2px solid #5eead4}#main,#chat{display:none}#welcome{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}.chat-head{background:#1e293b;padding:12px;display:flex;gap:10px;align-items:center;position:sticky;top:0}.chat-head button{width:auto;background:#334155;padding:8px 14px;border-radius:20px}.msgs{padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;height:calc(100vh - 120px);padding-bottom:90px}.bubble{max-width:85%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4}.me{align-self:flex-end;background:#14b8a6}.them{align-self:flex-start;background:#334155}.bubble img{max-width:200px;border-radius:12px;margin-top:6px;display:block}.inputRow{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;padding:10px;background:#0f172a;max-width:480px;margin:0 auto;align-items:center}.inputRow input{margin:0;flex:1}.inputRow button{width:auto;padding:12px 10px;border-radius:20px}.small{color:#94a3b8;font-size:12px;text-align:center;margin-top:8px}.iconBtn{background:#334155!important;font-size:18px;width:44px!important;height:44px;padding:0!important;display:flex;align-items:center;justify-content:center}.hideBox{display:none}</style></head><body>
<div id="welcome"><div class="card" style="width:100%;max-width:400px"><h1>Sia-Chat v15 💬</h1><input id="nameInput" placeholder="Your name"><input id="locInput" value="Bushbuckridge - Mpumalanga"><button onclick="startApp()">START CHATTING</button><p class="small">v15 Camera + Hide Contacts + SMART Bot</p></div></div>
<div id="main"><div class="card"><h1>Sia-Chat v15 📷</h1><p class="small" id="hello" style="text-align:left"></p><div class="contact sia" onclick="openChat('Sia Bot','BOT')"><div><b>Sia Bot 🤖 SMART</b><br><span style="font-size:12px">Knows Mpumalanga + Camera!</span></div><span style="background:#000;padding:4px 8px;border-radius:10px;font-size:10px">SMART</span></div>
<button onclick="importContacts()">📱 Import All From Phone</button><button onclick="addManual()" style="background:#0ea5e9;margin-top:8px">➕ Add Manually</button>
<button onclick="toggleContacts()" id="hideBtn" style="background:#475569;margin-top:8px">👁️ Hide Contacts</button>
<div id="contactWrap"><div id="contactList"></div></div>
<p class="small" id="status"></p><button onclick="resetApp()" style="background:#1f2937;margin-top:10px">Reset</button></div></div>
<div id="chat"><div class="chat-head"><button onclick="goBack()">← Back</button><div><b id="chatName"></b><br><span id="chatTel" style="font-size:11px;color:#94a3b8"></span></div></div><div class="msgs" id="msgs"></div>
<div class="inputRow">
<button class="iconBtn" onclick="$('camInput').click()">📷</button>
<input type="file" id="camInput" accept="image/*,video/*" capture="environment" style="display:none" onchange="sendMedia(this)">
<button class="iconBtn" onclick="sendFile()">📎</button>
<input id="msgInput" placeholder="Ask anything...">
<button onclick="sendMessage()" style="background:#14b8a6;width:60px">Send</button>
</div></div>
<script>
var myName=localStorage.getItem('sia_name')||'';var currentName='';var currentTel='';var contactsHidden=false;
function $(id){return document.getElementById(id);}
function loadContacts(){try{return JSON.parse(localStorage.getItem('sia_contacts')||'[]')}catch(e){return []}}
function saveContacts(c){localStorage.setItem('sia_contacts',JSON.stringify(c));}
function loadAllMsgs(){try{return JSON.parse(localStorage.getItem('sia_msgs_v15')||'{}')}catch(e){return {}}}
function saveAllMsgs(m){localStorage.setItem('sia_msgs_v15',JSON.stringify(m));}
function startApp(){var n=$('nameInput').value.trim();if(!n)n='Siyabonga';myName=n;localStorage.setItem('sia_name',n);$('hello').innerText='Hi, '+n+'! Camera ready!';showMain();}
function showMain(){$('welcome').style.display='none';$('main').style.display='block';$('chat').style.display='none';renderContacts();}
function renderContacts(){var list=loadContacts();var html='';for(var i=0;i<list.length;i++){html+='<div class=contact onclick="openChat(\''+list[i].name.replace(/'/g,'')+'\',\''+list[i].tel+'\')"><div><b>'+list[i].name+'</b><br><span style="font-size:12px;color:#94a3b8">'+list[i].tel+'</span></div><span>💬</span></div>';}if(!list.length)html='<p class=small>No contacts. Import!</p>';$('contactList').innerHTML=html;$('status').innerText=list.length+' contacts';}
function toggleContacts(){contactsHidden=!contactsHidden;$('contactWrap').style.display=contactsHidden?'none':'block';$('hideBtn').innerText=contactsHidden?'👁️ Show Contacts':'👁️ Hide Contacts';}
function openChat(name,tel){currentName=name;currentTel=tel;$('chatName').innerText=name;$('chatTel').innerText=(tel==='BOT'?'Sia SMART + 📷 Camera Enabled':tel);$('welcome').style.display='none';$('main').style.display='none';$('chat').style.display='block';var all=loadAllMsgs();if(name==='Sia Bot'&&(!all[name]||all[name].length===0)){all[name]=[{from:'them',text:'Hey '+myName+'! 👋 v15 with CAMERA! 📷'},{from:'them',text:'• Tap 📷 to take photo<br>• Tap 📎 to send file<br>• Tap 👁️ Hide Contacts to hide list<br>• I know Mpumalanga! Try "Where is Mpumalanga?" 🔍'},{from:'them',text:'Ready? Send me a photo! 😊'}];saveAllMsgs(all);}showMessages();}
function showMessages(){var all=loadAllMsgs();var msgs=all[currentName]||[];var out='';for(var i=0;i<msgs.length;i++){var cls=msgs[i].from==='me'?'me':'them';var text=msgs[i].text;if(msgs[i].img){text+='<br><img src="'+msgs[i].img+'">';}out+='<div class="bubble '+cls+'">'+text+'</div>';}$('msgs').innerHTML=out;setTimeout(function(){$('msgs').scrollTop=$('msgs').scrollHeight;},100);}
function sendMessage(){var input=$('msgInput');var txt=input.value.trim();if(!txt)return;var all=loadAllMsgs();if(!all[currentName])all[currentName]=[];all[currentName].push({from:'me',text:txt});saveAllMsgs(all);input.value='';showMessages();if(currentTel==='BOT'){setTimeout(function(){smartBotReply(txt);},600);}else{setTimeout(function(){var a=loadAllMsgs();a[currentName].push({from:'them',text:'(Saved) Photo/msg saved offline 💾'});saveAllMsgs(a);showMessages();},600);}}
function sendMedia(inputEl){var file=inputEl.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(e){var base64=e.target.result;var all=loadAllMsgs();if(!all[currentName])all[currentName]=[];all[currentName].push({from:'me',text:'📷 Photo:',img:base64});saveAllMsgs(all);showMessages();if(currentTel==='BOT'){setTimeout(function(){var a=loadAllMsgs();a[currentName].push({from:'them',text:'Nice photo '+myName+'! 📷😍 I see it! Beautiful! Bushbuckridge vibes!'});saveAllMsgs(a);showMessages();},800);}};reader.readAsDataURL(file);inputEl.value='';}
function sendFile(){alert('📎 File: Tap 📷 and choose Gallery - same as WhatsApp!');$('camInput').click();}
async function smartBotReply(userText){var low=userText.toLowerCase();var all=loadAllMsgs();var reply='';if(low.includes('mpumalanga')){reply='📍 <b>Mpumalanga</b> is eastern SA! 🇿🇦<br>• Capital: Mbombela<br>• Kruger Park 🦁<br>• Bushbuckridge is IN Mpumalanga - you are there! 😊<br>• Blyde River Canyon!';}else if(low.includes('camera')||low.includes('photo')){reply='📷 <b>Camera is ready!</b><br>• Tap 📷 button at bottom<br>• Take photo or choose gallery<br>• It will send in chat like WhatsApp!<br><br>Try it now! Tap 📷';}else if(low.includes('hide')){reply='👁️ <b>Hide Contacts:</b><br>Go Back → Tap "👁️ Hide Contacts" button. List hides! Tap again to show! I added it in v15!';}else if(low.includes('what is ai')||low.includes('search with ai')){reply='🤖 <b>AI = Artificial Intelligence</b><br>I learn to answer like human. Examples: ChatGPT, Meta AI, Me Sia Bot!';}else if(low.includes('where is')||low.includes('what is')||low.includes('who is')){try{var topic=userText.replace(/where is|what is|who is|\?/gi,'').trim();var url='https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(topic);var resp=await fetch(url);if(resp.ok){var data=await resp.json();reply='🔍 <b>'+data.title+'</b><br>'+data.extract;}else{reply='🔍 Searching "'+topic+'" - No net or not found. I know Mpumalanga, AI, Camera!';}}catch(e){reply='No internet for "'+userText+'". Ask about Mpumalanga offline!';}}else if(low.includes('hi')||low.includes('hello')||low.includes('dumela')){reply='Dumela '+myName+'! 😊 v15 with 📷 Camera! Tap 📷 to send photo! Try "hide contacts" too!';}else{reply='You: "'+userText+'"<br><br>📷 v15 NEW:<br>• 📷 Camera button - bottom left<br>• 👁️ Hide Contacts - main screen<br>• 🔍 SMART - knows Mpumalanga<br><br>Try: "Where is Mpumalanga" or tap 📷';}all=loadAllMsgs();all[currentName].push({from:'them',text:reply});saveAllMsgs(all);showMessages();}
function goBack(){showMain();}function addManual(){var n=prompt('Name:');if(!n)return;var t=prompt('Phone:')||'';var c=loadContacts();c.push({name:n,tel:t});saveContacts(c);renderContacts();}
async function importContacts(){var s=$('status');if(!(navigator.contacts&&window.ContactsManager)){s.innerText='Use Chrome';return;}try{s.innerText='Opening...';var contacts=await navigator.contacts.select(['name','tel'],{multiple:true});var existing=loadContacts();var added=0;for(var i=0;i<contacts.length;i++){var name=(contacts[i].name&&contacts[i].name[0])||'Unknown';var tel=(contacts[i].tel&&contacts[i].tel[0])||'';var found=false;for(var j=0;j<existing.length;j++){if(existing[j].name===name&&existing[j].tel===tel){found=true;break;}}if(!found){existing.push({name:name,tel:tel});added++;}}saveContacts(existing);renderContacts();s.innerText='Imported '+added+'! Total: '+existing.length;}catch(e){s.innerText='Cancelled';}}
function resetApp(){if(confirm('Clear all?')){localStorage.clear();location.reload();}}
$('msgInput').addEventListener('keydown',function(e){if(e.key==='Enter'){sendMessage();}});
$('nameInput').addEventListener('keydown',function(e){if(e.key==='Enter'){startApp();}});
(function(){if(myName){$('nameInput').value=myName;$('hello').innerText='Hi, '+myName+'!';showMain();}})();
</script></body></html>
